services:
  geocoding:
    build:
      context: .
      dockerfile: Dockerfile
    image: address-geocoding:latest
    container_name: address-geocoding

    env_file:
      - .env
    environment:
      - APP_LOG_ROOT=/app/logs
      - CONSOLE_FORMAT=json
      - PYTHONUNBUFFERED=1
    volumes:
      - ../LogReader/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
